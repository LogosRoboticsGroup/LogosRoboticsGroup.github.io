<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Logos Robotics Group</title>
  <script>
    const path = window.location.pathname;
    const project = path.split("/")[1];
    if (["SMR", "TIDE"].includes(project)) {
      const destinationPath = path === "/" + project ? path + "/" : path;
      window.location.replace("https://logosintelligencelab.github.io" + destinationPath + window.location.search + window.location.hash);
    }
  </script>
</head>
<body>
  <h1>Page not found</h1>
  <p>Project pages now hosted by Logos Intelligence Lab:</p>
  <ul>
    <li><a href="https://logosintelligencelab.github.io/SMR/">SMR</a></li>
    <li><a href="https://logosintelligencelab.github.io/TIDE/">TIDE</a></li>
  </ul>
</body>
</html>
